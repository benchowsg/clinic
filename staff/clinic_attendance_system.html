<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCheck - Location-Verified Attendance</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for Admin Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-5xl mx-auto w-full px-4 py-8 flex-1">

    <!-- 1. LANDING & STAFF AUTHENTICATION SCREEN -->
    <section id="view-login" class="max-w-md mx-auto my-12">
      <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm text-center">
        <div class="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4 shadow-md shadow-sky-100">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 leading-tight">MediCheck</h1>
        <p class="text-xs text-slate-500 mt-1 mb-6">Location-Verified Attendance</p>

        <form onsubmit="handleAuth(event)" class="space-y-4">
          <div class="text-left">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Staff Authentication</label>
            <input type="password" id="pin-input" maxlength="4" placeholder="Enter 4-Digit PIN" class="w-full text-center text-3xl font-mono tracking-widest py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none">
          </div>
          <p id="login-error" class="text-xs text-rose-600 hidden font-medium"></p>
          <button type="submit" class="w-full py-3 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-xl shadow-md shadow-sky-100 transition">
            Click Verify to Sign In
          </button>
        </form>
      </div>
    </section>

    <!-- 2. STAFF MOBILE CHECK-IN VIEW -->
    <section id="view-staff" class="hidden space-y-6 max-w-lg mx-auto">
